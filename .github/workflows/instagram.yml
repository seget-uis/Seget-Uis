name: Actualizar publicaciones de Instagram

on:
  schedule:
    - cron: "0 11 * * *" # todos los días, 6:00 a. m. en Colombia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar-instagram.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Guardar cambios
        run: |
          if git diff --quiet data/noticias.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json
          git commit -m "Actualizar publicaciones de Instagram"
          git push
